UI_HelpText=此工具用於備份、還原和修復 Windows 引導記錄以及管理驅動程序。\n\n工作原理：\n1. 備份：選擇分區並將其保存為 .wim 文件。\n2. 還原：選擇 .wim 文件，選擇目標磁碟/分區。\n3. 引導修復：使用自動掃描和修復。\n4. 驅動程序管理：備份現有驅動程序或從資料夾安裝驅動程序。

