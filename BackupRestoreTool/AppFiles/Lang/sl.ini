UI_HelpText=To orodje je namenjeno varnostnemu kopiranju, obnavljanju in popravilu zagonskih zapisov sistema Windows ter upravljanju gonilnikov.\n\nKako deluje:\n1. Varnostno kopiranje: Izberite particijo in jo shranite kot datoteko .wim.\n2. Obnavljanje: Izberite datoteko .wim (Install.wim itd.) in določite ciljni disk/particijo.\n3. Popravilo zagona: Če se sistem ne zažene, uporabite samodejno iskanje in popravilo.\n4. Upravljanje gonilnikov: Varnostno kopirajte obstoječe gonilnike ali samodejno namestite gonilnike iz določene mape.

